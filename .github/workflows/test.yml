name: 测试 / Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Linux / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装 pypinyin
        run: pip install pypinyin
      - name: 运行测试
        run: python run_tests.py -v

  test-windows-gbk:
    name: Windows + GBK 编码
    runs-on: windows-latest
    # 必须用环境变量而不是 chcp 936：chcp 只改控制台输出代码页，
    # 而 Python 的标准流编码取自 ANSI 代码页（GetACP），CI 机器是
    # en-US 即 1252，只 chcp 的话 Python 根本不会切到 GBK。
    # 历史事故（打包后的 exe 启动即 UnicodeEncodeError 崩溃）
    # 正是发生在真实的 GBK 环境下，所以这个任务不能省。
    env:
      PYTHONIOENCODING: cp936
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: 安装 pypinyin
        run: pip install pypinyin
      - name: 在 GBK 编码下运行测试
        run: python run_tests.py -v
